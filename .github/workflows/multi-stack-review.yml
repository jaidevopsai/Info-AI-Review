name: Multi-Stack Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    name: Detect stacks
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.stacks.outputs.dotnet }}
      react: ${{ steps.stacks.outputs.react }}
      python: ${{ steps.stacks.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: stacks
        name: Inspect repository
        shell: bash
        run: |
          dotnet=false
          react=false
          python=false
          compgen -G '*.csproj' >/dev/null || compgen -G '*.sln' >/dev/null || compgen -G '*.slnx' >/dev/null && dotnet=true
          [[ -f package.json || -f vite.config.js || -f vite.config.ts || -f next.config.js || -f next.config.mjs ]] && react=true
          [[ -f pyproject.toml || -f requirements.txt || -f requirements-test.txt || -f pytest.ini ]] && python=true
          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "react=$react" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected: dotnet=$dotnet react=$react python=$python"

  dotnet:
    name: .NET validation
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build with analyzers
        run: dotnet build --no-restore --configuration Release --warnaserror
      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage"

  react:
    name: React validation
    needs: detect
    if: needs.detect.outputs.react == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present -- --max-warnings=0
      - name: Type check
        run: npm run typecheck --if-present
      - name: Format check
        run: npm run format:check --if-present
      - name: Test
        run: npm test --if-present -- --runInBand
      - name: Build
        run: npm run build --if-present

  python:
    name: Python validation
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          if [[ -f requirements-test.txt ]]; then pip install -r requirements-test.txt; fi
          if [[ -f pyproject.toml ]]; then pip install -e '.[test]' || pip install -e .; fi
          pip install pytest
      - name: Test
        run: pytest -q

  summary:
    name: Review summary
    if: always()
    needs: [detect, dotnet, react, python]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo '## Multi-Stack Review'
            echo
            echo "Detected stacks: .NET=${{ needs.detect.outputs.dotnet }}, React=${{ needs.detect.outputs.react }}, Python=${{ needs.detect.outputs.python }}"
            echo
            echo "- .NET job: ${{ needs.dotnet.result }}"
            echo "- React job: ${{ needs.react.result }}"
            echo "- Python job: ${{ needs.python.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "${{ needs.dotnet.result }}" "${{ needs.react.result }}" "${{ needs.python.result }}"; do
            if [[ "$result" == 'failure' ]]; then exit 1; fi
          done
